# .github/workflows/ci.yml
name: O365-Management CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  pester-tests:
    name: Run Pester Test Suites
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PowerShell environment
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Install and Import Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module -Name Pester -MinimumVersion 5.3.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module -Name Pester -MinimumVersion 5.0.0 -Force

      - name: Validate Module Manifests
        shell: pwsh
        run: |
          # A .psd1 is PowerShell data - module manifests are one use of it,
          # config files are another. Only validate the manifests.
          $manifests = Get-ChildItem -Path . -Filter "*.psd1" -Recurse | Where-Object {
            $_.FullName -notmatch '[\\/]PrivateExports[\\/]' -and
            $_.Name -notmatch '^environment(\.example)?\.psd1$'
          }
          foreach ($m in $manifests) {
            Write-Host "[*] Testing manifest: $($m.FullName)"
            Test-ModuleManifest -Path $m.FullName -ErrorAction Stop
          }

      - name: Execute Module Pester Unit Tests
        shell: pwsh
        run: |
          # Each workflow step is its own pwsh process, so the import done
          # in the install step does not carry over. Without this the
          # [PesterConfiguration] type is not loaded here.
          Import-Module -Name Pester -MinimumVersion 5.0.0 -Force

          $pesterConfig = New-PesterConfiguration
          $pesterConfig.Run.Path = @(
            './Core/Tests'
            './Modules/O365Toolkit.Entra/Tests'
            './Modules/O365Toolkit.Teams/Tests'
            './Modules/O365Toolkit.Security/Tests'
            './Modules/O365Toolkit.SharePoint/Tests'
          ) | Where-Object { Test-Path $_ }

          $pesterConfig.Run.PassThru = $true
          $pesterConfig.Output.Verbosity = 'Detailed'
          $pesterConfig.TestResult.Enabled = $true
          $pesterConfig.TestResult.OutputFormat = 'NUnitXml'
          $pesterConfig.TestResult.OutputPath = './test-results.xml'

          $results = Invoke-Pester -Configuration $pesterConfig
          # A vanished test path is filtered out by Test-Path above, which
          # would otherwise let this step exit 0 with nothing run.
          if ($results.TotalCount -eq 0) {
            throw "CI build failed: no Pester tests were executed."
          }

          if ($results.FailedCount -gt 0) {
            throw "CI build failed: $($results.FailedCount) Pester test(s) failed."
          }
          Write-Host "CI PASS: $($results.PassedCount)/$($results.TotalCount) tests passed successfully." -ForegroundColor Green
