name: PowerShell Pester Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Run Pester Tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Display PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Install-Module `
            -Name Pester `
            -RequiredVersion 6.0.1 `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

          Import-Module `
            -Name Pester `
            -RequiredVersion 6.0.1 `
            -Force

          Get-Module Pester |
            Select-Object Name, Version, ModuleBase

      - name: Validate module manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Test-ModuleManifest `
            -Path "./PrimaryUserAudit_Share/PrimaryUserAudit.psd1"

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module `
            -Name Pester `
            -RequiredVersion 6.0.1 `
            -Force

          $Configuration = New-PesterConfiguration

          $Configuration.Run.Path = "./PrimaryUserAudit_Share/tests"
          $Configuration.Run.PassThru = $true
          $Configuration.Output.Verbosity = "Detailed"

          $Result = Invoke-Pester `
            -Configuration $Configuration

          if ($Result.FailedCount -gt 0) {
              throw "$($Result.FailedCount) Pester test(s) failed."
          }

          if ($Result.PassedCount -eq 0) {
              throw "No Pester tests were executed."
          }

          Write-Host ""
          Write-Host "Pester tests passed: $($Result.PassedCount)"
